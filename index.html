
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アイドルの紹介ページ</title>

    <style>
        /* ページ全体 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding-bottom: 130px;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #5C4A42;
            background-color: #FFFDF8;
        }

        /* ヘッダー */
        header {
            background-color: #F8D7E3;
            color: #765565;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        /* メインコンテンツ */
        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            color: #5C4A42;
        }

        section {
            background-color: #FFFFF0;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #F1E6D5;
        }

        h2 {
            color: #B88796;
            border-bottom: 2px solid #F3DDE4;
            padding-bottom: 8px;
        }

        /* フッター */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #FDF0F4;
            color: #8C6875;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            border-top: 1px solid #F5E1E8;
        }

        footer p {
            margin: 3px 0;
        }

        footer a {
            color: #A8798A;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* スマートフォン対応 */
        @media (max-width: 600px) {
            main {
                margin: 20px auto;
                padding: 0 12px;
            }

            footer {
                font-size: 12px;
                padding: 8px;
            }

            body {
                padding-bottom: 120px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>アイドルの紹介ページ</h1>
    </header>

    <main>
        <section>
            <h2>1. プロフィール</h2>
            <p>
                櫻坂46 2期生<br>
                守屋麗奈<br>
                東京都出身
            </p>
            <img src="画像のリンク" alt="サンプル">
        </section>

        <section>
            <h2>2. 仕事紹介</h2>
            <p>
                アイドル<br>
                モデル<br>
                女優
            </p>
        </section>
    </main>

    <footer>
        <p>お問い合わせ：info@example.com</p>
        <p>
            SNS：
            <a href="https://www.instagram.com/" target="_blank"
               rel="noopener noreferrer">Instagram</a>
            |
            <a href="https://x.com/" target="_blank"
               rel="noopener noreferrer">X</a>
        </p>
        <p>&copy; 2026 My Web Site</p>
    </footer>
</body>
</html>
